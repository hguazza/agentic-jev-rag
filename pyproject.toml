[project]
name = "agentic-jev-rag"
version = "0.1.0"
description = "Benchmark of three RAG Levels over EU legal text"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.19,<1.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls real OpenRouter models; excluded from the default run",
]
addopts = "-m 'not live'"
