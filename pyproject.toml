[project]
name = "agentic-jev-rag"
version = "0.1.0"
description = "SwiftAI Recruiter: a FastAPI RAG service and a LangGraph multi-agent recruiter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.19,<1.20",
    "fastapi>=0.140",
    "uvicorn[standard]>=0.50",
    "langgraph>=1.2,<1.3",
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
]
# The LiveKit voice worker (ADR 0012). Not in the default install or the Docker image: uv sync --group voice
voice = [
    "livekit-agents[openai,silero,turn-detector]==1.8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls real OpenRouter models; excluded from the default run",
]
addopts = "-m 'not live'"
